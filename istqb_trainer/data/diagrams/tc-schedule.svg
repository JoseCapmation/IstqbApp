  <text x="285" y="78" text-anchor="middle">priority: 3</text>

  <!-- TC 5 -->
  <rect x="440" y="30" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="505" y="58" text-anchor="middle" font-weight="bold">TC 5</text>
  <text x="505" y="78" text-anchor="middle">priority: 1</text>

  <!-- TC 6 -->
  <rect x="660" y="30" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="725" y="58" text-anchor="middle" font-weight="bold">TC 6</text>
  <text x="725" y="78" text-anchor="middle">priority: 3</text>

  <!-- ?? Bottom row: TC3  TC4 ? TC7 ?? -->

  <!-- TC 3 -->
  <rect x="20" y="170" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="85" y="198" text-anchor="middle" font-weight="bold">TC 3</text>
  <text x="85" y="218" text-anchor="middle">priority: 2</text>

  <!-- TC 4 -->
  <rect x="220" y="170" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="285" y="198" text-anchor="middle" font-weight="bold">TC 4</text>
  <text x="285" y="218" text-anchor="middle">priority: 2</text>

  <!-- TC 7 -->
  <rect x="440" y="170" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="505" y="198" text-anchor="middle" font-weight="bold">TC 7</text>
  <text x="505" y="218" text-anchor="middle">priority: 1</text>

  <!-- ?? Arrows ?? -->

  <!-- TC1 ? TC2 -->
  <line x1="150" y1="65" x2="218" y2="65" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- TC2 ? TC5 -->
  <line x1="350" y1="65" x2="438" y2="65" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- TC5 ? TC6 -->
  <line x1="570" y1="65" x2="658" y2="65" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- TC4 ? TC5  (diagonal up-right) -->
  <line x1="350" y1="195" x2="438" y2="100" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- TC4 ? TC7 -->
  <line x1="350" y1="205" x2="438" y2="205" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
