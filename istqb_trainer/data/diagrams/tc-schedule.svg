<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- ?? Top row: TC1 ? TC2 ? TC5 ? TC6 ?? -->

  <!-- TC 1 -->
  <rect x="20" y="30" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
  <text x="85" y="58" text-anchor="middle" font-weight="bold">TC 1</text>
  <text x="85" y="78" text-anchor="middle">priority: 2</text>

  <!-- TC 2 -->
  <rect x="220" y="30" width="130" height="70" rx="6" fill="white" stroke="#333" stroke-width="2"/>
