<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 580" font-family="Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <!-- Blue fill for shapes (matching original PDF) -->
  </defs>

  <!-- Read p,q,r,s  (parallelogram) -->
  <polygon points="48,20 212,20 200,58 36,58" fill="#8ec6f0" stroke="#1a6fa8" stroke-width="2"/>
  <text x="124" y="44" text-anchor="middle" font-weight="bold">Read p,q,r,s</text>

  <!-- Arrow down: v -->
  <line x1="124" y1="58" x2="124" y2="95" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="110" y="80" text-anchor="end" font-size="12">v</text>

  <!-- Decision: P>q  (diamond) -->
  <polygon points="124,100 200,150 124,200 48,150" fill="#8ec6f0" stroke="#1a6fa8" stroke-width="2"/>
  <text x="124" y="155" text-anchor="middle" font-weight="bold">P&gt;q</text>

  <!-- "if" label -->
  <text x="30" y="142" text-anchor="middle" font-size="12">if</text>

  <!-- Branch: true (w) ? P=s/P box (right) -->
  <line x1="200" y1="150" x2="235" y2="150" stroke="#333" stroke-width="1.8"/>
  <line x1="235" y1="150" x2="235" y2="210" stroke="#333" stroke-width="1.8"/>
  <text x="218" y="143" text-anchor="middle" font-size="12">true</text>
  <text x="245" y="185" font-size="12">w</text>
  <rect x="192" y="210" width="86" height="40" fill="#8ec6f0" stroke="#1a6fa8" stroke-width="2"/>
  <text x="235" y="235" text-anchor="middle">P=s/P</text>
  <line x1="235" y1="250" x2="235" y2="285" stroke="#333" stroke-width="1.8"/>
  <line x1="235" y1="285" x2="124" y2="285" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Branch: false (x) ? goes straight down -->
  <line x1="124" y1="200" x2="124" y2="285" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="100" y="248" text-anchor="end" font-size="12">false</text>
  <text x="108" y="230" text-anchor="end" font-size="12">x</text>

  <!-- "endif" label -->
  <text x="44" y="295" font-size="12">endif</text>

  <!-- Arrow down after first decision join -->
  <line x1="124" y1="285" x2="124" y2="325" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Decision: P+r<s  (diamond) -->
  <polygon points="124,330 210,385 124,440 38,385" fill="#8ec6f0" stroke="#1a6fa8" stroke-width="2"/>
  <text x="124" y="390" text-anchor="middle" font-weight="bold">P+r&lt;s</text>

  <!-- "if" label -->
  <text x="18" y="378" text-anchor="middle" font-size="12">if</text>

  <!-- Branch: true (y) ? r=r*P box (right) -->
  <line x1="210" y1="385" x2="240" y2="385" stroke="#333" stroke-width="1.8"/>
  <line x1="240" y1="385" x2="240" y2="445" stroke="#333" stroke-width="1.8"/>
  <text x="226" y="378" text-anchor="middle" font-size="12">true</text>
  <text x="248" y="420" font-size="12">y</text>
  <rect x="197" y="445" width="86" height="40" fill="#8ec6f0" stroke="#1a6fa8" stroke-width="2"/>
  <text x="240" y="470" text-anchor="middle">r=r*P</text>
  <line x1="240" y1="485" x2="240" y2="520" stroke="#333" stroke-width="1.8"/>
  <line x1="240" y1="520" x2="124" y2="520" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Branch: false (z) ? goes straight down -->
  <line x1="124" y1="440" x2="124" y2="520" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="100" y="482" text-anchor="end" font-size="12">false</text>
  <text x="108" y="462" text-anchor="end" font-size="12">z</text>

  <!-- "endif" label -->
  <text x="40" y="530" font-size="12">endif</text>

  <!-- Bottom line -->
  <line x1="124" y1="520" x2="124" y2="565" stroke="#333" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
